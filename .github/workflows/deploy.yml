name: CI/CD - GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Pruebas de respaldo/restauración y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas (pg_dump, respaldo físico, PITR, SHA-256, GFS)
        run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Desplegar en GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Prueba de humo
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${{ steps.deployment.outputs.page_url }}" | grep -q PgBackupLab; then echo "Sitio en línea"; exit 0; fi
            sleep 10
          done
          exit 1
